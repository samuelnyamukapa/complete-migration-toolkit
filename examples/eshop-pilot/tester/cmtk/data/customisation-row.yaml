  fields:
    - path: $
      type: object
      required: true
      nullable: false
      constraints: {}
      source: customisation-row.json#
      valid_from: object
    - path: $.catalogtypename
      type: string
      required: true
      nullable: false
      constraints:
        enum:
          - Mug
          - T-Shirt
          - Sheet
          - USB Memory Stick
      source: customisation-row.json#/properties/catalogtypename
      valid_from: enum
      note: "RULE-015: the type lookup is case-sensitive; RULE-030 names the 4 seed types"
    - path: $.catalogbrandname
      type: string
      required: true
      nullable: false
      constraints:
        enum:
          - Azure
          - .NET
          - Visual Studio
          - SQL Server
          - Other
      source: customisation-row.json#/properties/catalogbrandname
      valid_from: enum
      note: "RULE-015: the brand lookup is case-sensitive; RULE-030 names the 5 seed brands. Suspected defect: a brand-not-found error reports the type name"
    - path: $.description
      type: string
      required: true
      nullable: false
      constraints:
        maxLength: 200
      source: customisation-row.json#/properties/description
      valid_from: string
      note: "RULE-015: required header; CSV rows skip the model range rules"
    - path: $.name
      type: string
      required: true
      nullable: false
      constraints:
        minLength: 1
        maxLength: 50
      source: customisation-row.json#/properties/name
      valid_from: string
      note: "RULE-015 says CSV rows skip the 50-character limit, but RULE-011 says the database enforces it: question for the owner"
    - path: $.price
      type: string
      required: true
      nullable: false
      constraints:
        pattern: ^[0-9]+(\.[0-9]{1,2})?$
      source: customisation-row.json#/properties/price
      valid_from: pattern
      note: "RULE-015: parsed with AllowDecimalPoint and InvariantCulture: no thousands separator, no minus sign; '12,5' throws 'price=12,5is not a valid decimal number'"
    - path: $.pictureFileName
      type: string
      required: true
      nullable: false
      constraints:
        pattern: ^[A-Za-z0-9_-]+\.(png|jpg)$
      source: customisation-row.json#/properties/pictureFileName
      valid_from: pattern
      note: "RULE-015: required header"
    - path: $.availablestock
      type: string
      required: false
      nullable: false
      constraints:
        pattern: ^[0-9]{1,8}$
