  fields:
    - path: $
      type: object
      required: true
      nullable: false
      constraints: {}
      source: catalog-item.json#
      valid_from: object
    - path: $.Name
      type: string
      required: true
      nullable: false
      constraints:
        minLength: 1
        maxLength: 50
      source: catalog-item.json#/properties/Name
      valid_from: string
      note: "RULE-011: required; the 50-character limit exists only in the database, so against UseMockData=true a longer name is saved, and against the database it gives an error page, not a field message (suspected defect). The rows for the limit are in the db-only case file"
    - path: $.Description
      type: string
      required: false
      nullable: true
      constraints: {}
      source: catalog-item.json#/properties/Description
      valid_from: string
      note: "RULE-011: optional. No rule and no attribute limits its length (the 200 guessed in part 4 was answered by the run: none)"
    - path: $.Price
      type: number
      required: false
      nullable: false
      constraints:
        minimum: 0
        maximum: 1000000
        multipleOf: 0.01
      source: catalog-item.json#/properties/Price
      valid_from: number
      note: "RULE-013: 0 to 1,000,000 with at most two decimals; 19.999 is rejected, 19.50 and 0 are accepted. Not required: no rule says so, and a post without it binds to 0 (a browser always sends the field). RULE-013 says 1,000,000.01 fails the Range rule; the run showed it is saved (defect D-03)"
    - path: $.CatalogBrandId
      type: integer
      required: true
      nullable: false
      constraints:
        enum:
          - 1
          - 2
          - 3
          - 4
          - 5
      source: catalog-item.json#/properties/CatalogBrandId
      valid_from: enum
      note: "RULE-012: must reference an existing brand; RULE-030: the seed has 5 brands. The database enforces it, UseMockData=true does not: the unknown-brand rows are in the db-only case file"
    - path: $.CatalogTypeId
      type: integer
      required: true
      nullable: false
      constraints:
        enum:
          - 1
          - 2
          - 3
          - 4
      source: catalog-item.json#/properties/CatalogTypeId
      valid_from: enum
      note: "RULE-012: must reference an existing type; RULE-030: the seed has 4 types. As for the brand"
    - path: $.AvailableStock
      type: integer
      required: false
      nullable: false
      constraints:
        minimum: 0
        maximum: 10000000
      source: catalog-item.json#/properties/AvailableStock
      valid_from: integer
      note: "RULE-014: 0 to 10 million; 'The field Stock must be between 0 and 10 million.' Not required by any rule; absent binds to 0 (question Q-13 for the owner)"
    - path: $.RestockThreshold
      type: integer
      required: false
      nullable: false
