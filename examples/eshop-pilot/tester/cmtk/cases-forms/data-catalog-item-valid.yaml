# Draft cases from the test-data recipe catalog-item: one per valid row (the rows the schema calls valid), each sending its row from cmtk/data/catalog-item/rows/ as a form. A person accepts them with `cmtk review`.
cases:
  - id: CATALOG-ITEM-001
    name: "every field: a valid representative"
    requirement:
      - RULE-009
      - RULE-011
      - RULE-013
      - RULE-014
      - RULE-020
    request:
      method: POST
      path: /Catalog/Create
      body_form: cmtk/data/catalog-item/rows/baseline_valid.json
      before:
        get: /Catalog/Create
        take:
          __RequestVerificationToken: input[name=__RequestVerificationToken]
    expect:
      status: 302
    draft: true
    draft_note: "From recipe catalog-item, row baseline_valid (EP): every field: a valid representative. The schema says the body is valid; the oracle is specified. Sent as a browser posts a form (application/x-www-form-urlencoded), from the row's fields. Before it, /Catalog/Create is read for __RequestVerificationToken; the values taken are never written to evidence. The expected status 302 was given on the command line, not read from a document: the reviewer confirms it against the requirement. This request changes data: it runs only with allow_unsafe_methods: true in the settings and --allow-unsafe on the run, against disposable test data."
