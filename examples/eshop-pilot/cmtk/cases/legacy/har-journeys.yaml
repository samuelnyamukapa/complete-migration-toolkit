# Cases imported from a HAR recording of legacy eShop in Edge (03-checks), then reviewed:
# each now names its requirement and says what it expects. Cookies and other credentials were
# dropped on import; the raw HAR was deleted. Raw import: cmtk/cases/imported/har.yaml.
cases:
  - id: HAR-001
    name: "the list page loads item 2's picture as PNG"
    requirement: CAT-4/AC-1
    request:
      method: GET
      path: "/items/2/pic"
      headers: { Accept: "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8", Accept-Language: "en-GB,en;q=0.9,en-US;q=0.8" }
    source: har:recording.har
    expect: { status: 200, headers: { Content-Type: image/png } }

