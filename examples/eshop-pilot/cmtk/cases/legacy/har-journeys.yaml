      headers: { Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7", Accept-Language: "en-GB,en;q=0.9,en-US;q=0.8" }
    source: har:recording.har
    expect: { status: 200, headers: { Content-Type: { matches: "^application/xml" } }, body_contains: ["Visual Studio"] }
