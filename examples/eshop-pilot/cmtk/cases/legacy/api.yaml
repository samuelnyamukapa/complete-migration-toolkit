# API-1 to API-3: the HTTP APIs other systems may call. Sources: RULE-024, RULE-027, RULE-030.
cases:
  - id: API-1-01
    name: the brands API lists the five seeded brands in Id order
    requirement: API-1/AC-1
    request: GET /api/brands
    expect:
      status: 200
      headers: { Content-Type: { matches: "^application/json" } }
      json:
        "$[0].Id": { equals: 1 }
        "$[0].Brand": { equals: Azure }
        "$[4].Brand": { equals: Other }
        "$[5]": { exists: false }
        "$[*].Brand": { type: string }

  - id: API-1-02
    name: one brand by id
    requirement: API-1/AC-2
    request: GET /api/brands/2
    expect:
      status: 200
      json:
        "$.Id": { equals: 2 }
        "$.Brand": { equals: .NET }

  - id: API-1-03
    name: an unknown brand gives 404
    requirement: API-1/AC-3
    request: GET /api/brands/99
    expect: { status: 404 }

  - id: API-2-01
    name: the api root says hello as JSON
    requirement: API-2/AC-1
    request: GET /api
    expect:
      status: 200
      json:
        "$.Message": { equals: Hello World! }

  - id: API-3-01
    name: the files API answers (its body is BinaryFormatter output, RULE-027)
    requirement: API-3/AC-1
    request: GET /api/files
    expect: { status: 200 }

  - id: NAV-1-01
    name: an unknown address gives 404
    requirement: NAV-1/AC-1
    request: GET /no-such-page
    expect: { status: 404 }
